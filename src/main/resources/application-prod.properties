server.port=${PORT:8081}
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jackson.serialization.write-dates-as-timestamps=false
nexus.jwt.secret=${JWT_SECRET}
nexus.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
nexus.seed.demo-users=false
nexus.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}
nexus.ai.enabled=${AI_ENABLED:false}
nexus.ai.base-url=${AI_BASE_URL:https://api.openai.com/v1}
nexus.ai.api-key=${AI_API_KEY:}
nexus.ai.model=${AI_MODEL:gpt-4o-mini}
