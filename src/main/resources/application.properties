spring.application.name=nexus-platform
server.port=${PORT:8081}
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/nexus_db}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jackson.serialization.write-dates-as-timestamps=false
springdoc.swagger-ui.path=/swagger-ui.html
nexus.jwt.secret=${JWT_SECRET:change-this-secret-to-a-long-random-production-value-123456789}
nexus.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
nexus.seed.demo-users=true
nexus.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
nexus.ai.enabled=${AI_ENABLED:false}
nexus.ai.base-url=${AI_BASE_URL:https://api.openai.com/v1}
nexus.ai.api-key=${AI_API_KEY:}
nexus.ai.model=${AI_MODEL:gpt-4o-mini}
